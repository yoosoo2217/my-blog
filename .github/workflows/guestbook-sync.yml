name: Guestbook sync

# Refreshes _data/guestbook.json (message count + latest messages shown in the
# TODAY IS window) from the giscus discussion, then asks Pages to rebuild.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/sync_guestbook.py "${{ github.repository }}"
      - name: Commit and rebuild when changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _data/guestbook.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/guestbook.json
          git commit -m "chore: sync guestbook snapshot"
          git push
          # Pushes made with GITHUB_TOKEN do not trigger the Pages build.
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
