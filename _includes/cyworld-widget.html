<script>
(function () {
	var audio = document.getElementById('cy-bgm');
	var playBtn = document.getElementById('cy-play-btn');
	var pauseBtn = document.getElementById('cy-pause-btn');
	var stopBtn = document.getElementById('cy-stop-btn');
	var restartBtn = document.getElementById('cy-restart-btn');
	var rewindBtn = document.getElementById('cy-rewind-btn');
	var forwardBtn = document.getElementById('cy-forward-btn');
	var endBtn = document.getElementById('cy-end-btn');
	var repeatBtn = document.getElementById('cy-repeat-btn');
	var heartBtn = document.getElementById('cy-heart-btn');
	var volUpBtn = document.getElementById('cy-vol-up');
	var volDownBtn = document.getElementById('cy-vol-down');
	var volFill = document.getElementById('cy-vol-fill');
	var seek = document.getElementById('cy-mp-seek');
	var currentEl = document.getElementById('cy-mp-current');
	var durationEl = document.getElementById('cy-mp-duration');
	if (!audio || !playBtn) { return; }

	var seeking = false;

	function formatTime(sec) {
		if (!isFinite(sec) || sec < 0) { sec = 0; }
		var m = Math.floor(sec / 60);
		var s = Math.floor(sec % 60);
		return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
	}

	// The native range input has no cross-browser "fill" for the played
	// portion, so we paint it ourselves as a two-color gradient that moves
	// with the thumb.
	function updateSeekFill(percent) {
		if (!seek) { return; }
		percent = Math.max(0, Math.min(100, percent));
		seek.style.background =
			'linear-gradient(to right, #1a9c4b 0%, #1a9c4b ' + percent + '%, #ffffff ' + percent + '%, #ffffff 100%)';
	}

	// Refreshes the seek bar/time display from audio.currentTime directly,
	// instead of waiting on a 'timeupdate' event — that event isn't
	// guaranteed to fire promptly right after a programmatic seek (e.g.
	// clicking rewind/forward/restart while paused), so those buttons call
	// this themselves rather than relying on it.
	function refreshSeekUI() {
		if (currentEl) { currentEl.textContent = formatTime(audio.currentTime); }
		if (audio.duration) {
			var pct = (audio.currentTime / audio.duration) * 1000;
			if (seek) { seek.value = String(pct); }
			updateSeekFill(pct / 10);
		}
	}

	// Play/Pause/Stop are separate buttons (matching a classic CD player's
	// transport row) rather than one toggling button; setPlayingUI just
	// highlights whichever of Play/Pause matches the audio element's real
	// state, so it also catches autoplay-block failures and the element
	// being controlled from elsewhere.
	function setPlayingUI(isPlaying) {
		if (playBtn) { playBtn.classList.toggle('cy-mp-btn-toggle-on', isPlaying); }
		if (pauseBtn) { pauseBtn.classList.toggle('cy-mp-btn-toggle-on', !isPlaying); }
	}

	playBtn.addEventListener('click', function () {
		audio.play().catch(function () { setPlayingUI(false); });
	});
	if (pauseBtn) {
		pauseBtn.addEventListener('click', function () { audio.pause(); });
	}
	if (stopBtn) {
		stopBtn.addEventListener('click', function () {
			audio.pause();
			audio.currentTime = 0;
			refreshSeekUI();
		});
	}

	audio.addEventListener('play', function () { setPlayingUI(true); });
	audio.addEventListener('pause', function () { setPlayingUI(false); });
	audio.addEventListener('ended', function () { setPlayingUI(false); });

	// One track only, so these skip within it rather than between tracks.
	if (restartBtn) {
		restartBtn.addEventListener('click', function () { audio.currentTime = 0; refreshSeekUI(); });
	}
	if (rewindBtn) {
		rewindBtn.addEventListener('click', function () {
			audio.currentTime = Math.max(0, audio.currentTime - 10);
			refreshSeekUI();
		});
	}
	if (forwardBtn) {
		forwardBtn.addEventListener('click', function () {
			// No artificial upper bound here: with preload="none", duration
			// is NaN (falsy) until playback/loading actually starts, which
			// used to clamp this to 0 and made the button do nothing before
			// the track had ever been played once.
			audio.currentTime = audio.duration
				? Math.min(audio.duration, audio.currentTime + 10)
				: audio.currentTime + 10;
			refreshSeekUI();
		});
	}
	if (endBtn) {
		// Symmetric to the restart ("|◀") button: jumps to the end of the
		// track instead of the start. Same NaN-duration guard as forward.
		endBtn.addEventListener('click', function () {
			audio.currentTime = audio.duration ? Math.max(0, audio.duration - 0.25) : audio.currentTime;
			refreshSeekUI();
		});
	}

	// Favorite toggle, persisted per-visitor so it survives a reload.
	if (heartBtn) {
		var HEART_KEY = 'cy-bgm-favorite';
		var setHeartUI = function (isFav) {
			heartBtn.textContent = isFav ? '♥' : '♡';
			heartBtn.setAttribute('aria-pressed', String(isFav));
			heartBtn.classList.toggle('cy-mp-btn-toggle-on', isFav);
			heartBtn.title = isFav ? '즐겨찾기 해제' : '즐겨찾기 추가';
		};
		var initialFav = false;
		try { initialFav = localStorage.getItem(HEART_KEY) === '1'; } catch (e) { /* private mode etc. */ }
		setHeartUI(initialFav);
		heartBtn.addEventListener('click', function () {
			var next = heartBtn.getAttribute('aria-pressed') !== 'true';
			setHeartUI(next);
			try { localStorage.setItem(HEART_KEY, next ? '1' : '0'); } catch (e) { /* private mode etc. */ }
		});
	}

	// The old widget always looped; keep that as the default; the button
	// just makes it an actual, visible, toggleable setting instead of a
	// hardcoded one.
	audio.loop = true;
	if (repeatBtn) {
		repeatBtn.addEventListener('click', function () {
			audio.loop = !audio.loop;
			repeatBtn.classList.toggle('cy-mp-btn-toggle-on', audio.loop);
			repeatBtn.setAttribute('aria-pressed', String(audio.loop));
			repeatBtn.title = audio.loop ? '반복 재생 켜짐' : '반복 재생 꺼짐';
		});
	}

	function updateVolumeUI() {
		if (volFill) { volFill.style.height = Math.round(audio.volume * 100) + '%'; }
	}
	audio.volume = 0.7;
	updateVolumeUI();
	if (volUpBtn) {
		volUpBtn.addEventListener('click', function () {
			audio.volume = Math.min(1, Math.round((audio.volume + 0.1) * 10) / 10);
			updateVolumeUI();
		});
	}
	if (volDownBtn) {
		volDownBtn.addEventListener('click', function () {
			audio.volume = Math.max(0, Math.round((audio.volume - 0.1) * 10) / 10);
			updateVolumeUI();
		});
	}

	updateSeekFill(0);
	audio.addEventListener('loadedmetadata', function () {
		if (durationEl) { durationEl.textContent = formatTime(audio.duration); }
		refreshSeekUI();
	});
	audio.addEventListener('timeupdate', function () {
		if (seeking) { return; }
		refreshSeekUI();
	});

	if (seek) {
		seek.addEventListener('input', function () {
			seeking = true;
			updateSeekFill(seek.value / 10);
			if (currentEl && audio.duration) {
				currentEl.textContent = formatTime((seek.value / 1000) * audio.duration);
			}
		});
		seek.addEventListener('change', function () {
			if (audio.duration) {
				audio.currentTime = (seek.value / 1000) * audio.duration;
			}
			seeking = false;
		});
	}
})();
</script>

<script>
// Keep every sidebar block (TODAY IS, Cruise FM, guestbook, visitors) on one
// screen without a scrollbar: measure the natural height and, only if it is
// taller than the room under the sticky offset and above the taskbar, shrink
// it with CSS zoom. Re-measured on resize and when the visitor badge loads.
(function () {
	var box = document.querySelector('.cy-sidebar-sticky');
	if (!box) { return; }
	function fit() {
		box.style.zoom = '';
		if (window.innerWidth <= 900) { return; } // stacked layout, no sticky
		var room = window.innerHeight - 62; // 16px top offset + 30px taskbar + margin
		var natural = box.offsetHeight;
		if (natural > room && natural > 0) {
			box.style.zoom = String(Math.max(0.55, room / natural));
		}
	}
	fit();
	window.addEventListener('resize', fit);
	window.addEventListener('load', fit);
	var imgs = box.querySelectorAll('img');
	for (var i = 0; i < imgs.length; i++) {
		imgs[i].addEventListener('load', fit);
	}
})();
</script>
