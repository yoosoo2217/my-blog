<script>
(function () {
	var audio = document.getElementById('cy-bgm');
	var btn = document.getElementById('cy-music-btn');
	if (!audio || !btn) return;

	function setPlayingUI(isPlaying) {
		btn.textContent = isPlaying ? '⏸ BGM 정지' : '▶ BGM 재생';
	}

	btn.addEventListener('click', function () {
		if (audio.paused) {
			audio.play().then(function () {
				setPlayingUI(true);
			}).catch(function () {
				setPlayingUI(false);
			});
		} else {
			audio.pause();
			setPlayingUI(false);
		}
	});

	audio.addEventListener('ended', function () {
		setPlayingUI(false);
	});
})();
</script>
