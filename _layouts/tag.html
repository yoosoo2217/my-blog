---
layout: default
---
<p>'{{ page.tag }}' 태그가 달린 글 {{ site.tags[page.tag] | size }}개</p>
<ul>
	{% assign tag_posts = site.tags[page.tag] | sort: "date" | reverse %}
	{% for post in tag_posts %}
		<li><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a> ({{ post.date | date: "%Y-%m-%d" }})</li>
	{% endfor %}
</ul>
