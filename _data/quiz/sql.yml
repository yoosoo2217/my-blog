    - "id = 1 계좌의 잔액이 바뀐다"
    - "id = 99 인 행이 새로 만들어진다"
    - "에러 없이 0 rows affected로 끝난다"
  answer: 3
  explain: "조건에 맞는 행이 없으면 에러가 아니라 적용된 행 0개로 조용히 끝난다. DB 입장에서는 정상 실행이라 이체가 의도대로 끝났는지는 사용하는 쪽이 판단하고 rollback 해야 한다."
  post: "mysql-transaction"

- topic: SQL
  q: "홍길동 10000, 김짱구 5000 에서 다음 트랜잭션을 실행했다. 마지막 select 결과는?"
  code: |
    start transaction;
    update accouts set balance = balance - 3000 where id = 1;
    update accouts set balance = balance + 3000 where id = 2;
    commit;
    select * from accouts;
  choices:
    - "홍길동 7000, 김짱구 8000"
    - "홍길동 10000, 김짱구 5000"
    - "홍길동 7000, 김짱구 5000"
    - "홍길동 13000, 김짱구 2000"
  answer: 0
  explain: "홍길동은 10000에서 3000을 빼 7000, 김짱구는 5000에 3000을 더해 8000이 되고 commit으로 확정된다."
  post: "mysql-transaction"

- topic: SQL
  q: "홍길동 7000, 김짱구 8000 상태에서 다음을 실행했다. 마지막 select에서 홍길동의 잔액은?"
  code: |
    start transaction;
    update accouts set balance = balance - 3000 where id = 1;
    update accouts set balance = balance + 3000 where id = 99;
    rollback;
    select * from accouts;
  choices:
    - "4000"
    - "1000"
    - "7000"
    - "10000"
  answer: 2
  explain: "첫 update로 홍길동은 4000이 되지만 id = 99 update는 0행이다. rollback이 트랜잭션 시작 시점으로 되돌리므로 7000으로 복구된다."
  post: "mysql-transaction"

- topic: SQL
