- topic: SQL
  q: "메서드 안에서 선언한 지역변수는 언제 사라질까?"
  choices:
    - "JVM이 종료될 때"
    - "메서드 실행이 끝나 Stack의 프레임이 제거될 때"
    - "GC가 실행될 때"
    - "사라지지 않고 계속 남는다"
  answer: 1
  explain: "지역변수는 Stack의 프레임 안에 살다가 메서드가 끝나면 프레임과 함께 사라진다. GC는 Heap의 객체를 수거하는 장치라 지역변수와 관계가 없고, JVM 종료는 훨씬 나중이다."
  post: "database-intro-quiz"

- topic: SQL
  q: "GC(가비지 컬렉터)가 수거하는 대상은 무엇일까?"
  choices:
    - "Stack의 지역변수"
    - "static 변수"
    - "Heap에 있으면서 아무도 참조하지 않는 객체"
    - "디스크에 저장된 파일"
  answer: 2
  explain: "GC는 Heap의 객체 중 참조하는 곳이 없어진 것을 회수한다. 지역변수는 메서드가 끝나면 Stack에서 제거되고, static 변수는 JVM이 종료될 때까지 산다."
  post: "database-intro-quiz"

- topic: SQL
  q: "회원 목록을 static List에 담아 둔 서비스를 재시작하면 어떻게 될까?"
  choices:
    - "static 변수라서 그대로 남는다"
    - "자동으로 파일에 저장되어 복구된다"
    - "Heap이 아니므로 GC 대상이 아니어서 남는다"
    - "새 JVM이 새 리스트를 만들기 때문에 회원이 모두 사라진다"
  answer: 3
  explain: "static 변수가 JVM 안에서 가장 오래 살지만 수명의 끝은 JVM 종료다. JVM이 꺼지면 OS가 메모리를 회수하고, 메모리 내용을 자동으로 파일에 옮겨 주는 기능은 없다."
  post: "database-why-needed"

