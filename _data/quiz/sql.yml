    LEFT JOIN review v ON r.restaurant_id = v.restaurant_id
  choices:
    - "LEFT JOIN이 JOIN보다 항상 빠르기 때문에"
    - "리뷰가 없는 가게의 행도 남기기 위해서. JOIN이면 가게 행이 사라져 존재하지 않는 가게처럼 처리된다"
    - "AVG를 쓰려면 반드시 LEFT JOIN이어야 해서"
    - "리뷰를 최신 10개로 제한하기 위해서"
