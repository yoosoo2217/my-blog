  explain: "JOIN은 짝이 없는 행을 지워 리뷰가 없는 가게가 조회되지 않는다. LEFT JOIN은 가게 행을 남기고 리뷰가 없으면 AVG가 NULL이 되어 평점 없음으로 연결된다."
  post: "java-mvc-review-feature-enum-result"

