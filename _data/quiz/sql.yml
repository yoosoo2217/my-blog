  choices:
    - "HAVING이 WHERE보다 항상 빠르기 때문에"
    - "WHERE는 숫자 컬럼에는 쓸 수 없기 때문에"
    - "WHERE는 SELECT가 끝난 뒤에 실행되기 때문에"
    - "WHERE는 그룹으로 묶기 전에 적용되어 아직 집계 결과가 없기 때문에"
  answer: 3
  explain: "처리 순서는 FROM, WHERE, GROUP BY, HAVING, SELECT 순이다. WHERE는 묶기 전의 행 단위 조건이라 집계 결과를 쓸 수 없고, 묶은 뒤의 그룹 조건은 HAVING이 맡는다."
  post: "mysql-select-basics"

