  answer: 3
  explain: "UNION은 수학의 합집합처럼 중복 행을 제거한다. UNION ALL은 중복을 제거하지 않는다. 둘 다 select의 컬럼 개수가 같아야 한다."
  post: "mysql-union"

- topic: SQL
