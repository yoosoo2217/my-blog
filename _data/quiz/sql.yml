    - "정상적으로 생성되고 삭제 시 거부된다"
    - "경고만 나오고 NOT NULL이 해제된다"
  answer: 0
  explain: "SET NULL은 NULL을 허용하는 컬럼에만 쓸 수 있다. NOT NULL 컬럼에 지정하면 테이블 생성이 실패한다."
  post: "db-design-physical-modeling-keys-referential-integrity"

- topic: SQL
  q: "외래키를 걸면서 ON DELETE, ON UPDATE 옵션을 하나도 쓰지 않고 부모 행을 삭제하면 어떻게 동작할까?"
  choices:
