    - "등급 20은 삭제되고 두 회원의 grade_code는 20으로 남는다"
  answer: 1
  explain: "CASCADE는 부모가 변경되거나 삭제되면 자식도 함께 변경, 삭제한다. 첫 번째는 RESTRICT, 세 번째는 SET NULL의 동작이다."
  post: "db-design-physical-modeling-keys-referential-integrity"

- topic: SQL
