  choices:
    - "O"
    - "X"
  answer: 1
  explain: "commit 전의 select 결과는 트랜잭션 안에서 본 임시 상태다. rollback을 하면 그 값은 사라진다."
  post: "mysql-transaction"

- topic: SQL
