  post: "db-design-conceptual-modeling-erd"

- topic: SQL
  q: "tbl_user가 user_grade를 외래키로 참조하고 있다. 외래키에 ON DELETE CASCADE를 지정하고 grade_code 20인 등급을 삭제하면(등급 20을 가진 회원이 2명) 어떻게 될까?"
  choices:
    - "삭제가 거부된다"
    - "등급 20과 함께 그 등급을 가진 회원 행 2개도 삭제된다"
