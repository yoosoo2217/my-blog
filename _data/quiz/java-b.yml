- topic: Java
  q: "아래 `OrderService`를 SMS 전송 방식으로 바꾸려 할 때 드러나는 설계상의 문제는?"
  code: |
    class EmailSender {
        public void send(String msg) {
            System.out.println("이메일: " + msg);
        }
    }

    class OrderService {
        private EmailSender sender = new EmailSender();

        public void complete() {
            sender.send("주문 완료");
        }
    }
  choices:
    - "`send`가 `public`이라서 SMS 방식으로는 호출할 수 없다."
    - "`OrderService`가 구체 클래스 `EmailSender`를 직접 알고 있어서, 전송 방식을 바꾸려면 `OrderService`를 고쳐야 한다."
    - "`EmailSender`가 `private` 필드에 담겨 있어서 다른 클래스로 교체하는 것이 문법적으로 금지된다."
    - "`new EmailSender()`는 한 번만 호출할 수 있어서 SMS 클래스를 추가로 만들 수 없다."
  answer: 1
  explain: "이 코드에서 `OrderService`는 `EmailSender`라는 구체 클래스에 직접 의존하므로 SMS로 바꾸려면 `OrderService` 안을 직접 고쳐야 한다. 인터페이스(`MessageSender`)에 의존하게 하면 넣는 구현만 바꾸면 된다."
  post: "java-why-interface"

- topic: Java
  q: "`MessageSender` 인터페이스를 구현한 아래 클래스를 컴파일하면 어떻게 되는가?"
  code: |
    interface MessageSender {
        void send(String msg);
    }

    class SmsSender implements MessageSender {
        void send(String msg) {
            System.out.println("SMS: " + msg);
        }
    }
  choices:
    - "정상적으로 컴파일되고 `SMS: ...`를 출력한다."
    - "인터페이스의 `send`에 `public`이 없으므로 구현 클래스에서도 `public`을 쓰면 오류가 난다."
    - "`SmsSender`를 `abstract`로 선언하라는 경고만 나온다."
    - "인터페이스 메소드는 자동으로 `public`인데 구현 쪽이 더 좁은 접근 권한이라 컴파일 오류가 난다."
  answer: 3
  explain: "인터페이스의 메소드는 자동으로 `public`이다. 구현 클래스에서 접근 제어자를 생략하면 더 좁은 접근 권한이 되어 컴파일되지 않으므로 `public void send`로 써야 한다."
  post: "java-why-interface"

- topic: Java
  q: "글에서 인터페이스를 굳이 만들지 않아도 된다고 한 경우로 알맞은 것은?"
  choices:
    - "구현이 하나뿐이고 앞으로도 바뀔 일이 없어서, 인터페이스가 파일과 코드만 늘리는 경우"
