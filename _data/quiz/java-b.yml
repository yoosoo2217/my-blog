    - "테스트에서 실제 객체 대신 가짜 구현을 끼워 넣어야 하는 경우"
  answer: 0
  explain: "글은 구현이 하나뿐이고 바뀔 일이 없다면 인터페이스는 파일과 코드만 늘린다고 했다. 구현이 둘 이상이 되거나 테스트가 어려워질 때 분리해도 늦지 않다."
  post: "java-why-interface"

- topic: Java
  q: "`OrderService`를 테스트할 때 `FakeSender`를 넣으면 이메일 서버가 없어도 확인할 수 있는 이유는?"
  code: |
    class FakeSender implements MessageSender {
        String last;

        public void send(String msg) {
            last = msg;
        }
    }
  choices:
    - "`FakeSender`가 `EmailSender`를 상속해 실제 이메일 전송을 건너뛰기 때문"
    - "`FakeSender`의 `send`가 `static`이라서 객체 없이 호출되기 때문"
    - "`OrderService`가 `MessageSender`라는 약속에만 의존하므로, 같은 약속을 지키는 가짜 구현으로 바꿔 끼워도 동작하기 때문"
    - "인터페이스를 구현한 클래스는 `send`를 호출해도 항상 아무 일도 하지 않기 때문"
  answer: 2
  explain: "`OrderService`는 `MessageSender` 타입만 알기 때문에 `new OrderService(fake)`처럼 가짜 구현을 넣을 수 있고, `complete()` 호출 뒤 `fake.last`가 \"주문 완료\"인지만 확인하면 된다."
  post: "java-why-interface"

- topic: Java
  q: "`Duck`이 `Flyable`과 `Swimmable` 두 역할을 함께 가지도록 `implements Flyable, Swimmable`로 선언한 것이 가능한 이유는?"
  choices:
    - "`implements`는 `extends`와 달리 부모 클래스의 필드를 물려받기 때문"
    - "자바에서 클래스는 `extends`로 하나만 상속할 수 있지만, 인터페이스는 여러 개를 구현할 수 있기 때문"
    - "인터페이스는 `new`로 만들 수 없으므로 한 클래스에 몇 개를 붙여도 충돌하지 않기 때문"
    - "`Flyable`과 `Swimmable`이 서로 상속 관계라서 하나로 합쳐지기 때문"
  answer: 1
  explain: "글은 클래스 상속(`extends`)은 한 클래스가 1개만 가질 수 있고, 인터페이스 구현(`implements`)은 여러 개를 가질 수 있다고 정리했다. 그래서 서로 다른 역할을 한 클래스가 함께 가질 때 인터페이스를 쓴다."
  post: "java-why-interface"
