  answer: 2
  explain: "컨테이너가 프록시를 만들도록 켜 주는 설정이므로, 지우면 Aspect가 적용되지 않는다. 글에서는 강의 자료의 설명으로 소개한 내용이다."
  post: "spring-aop-practice"

- topic: Spring
  q: "인터페이스가 없는 MemberService에 AOP를 적용했을 때, context.getBean(MemberService.class)가 돌려주는 객체는?"
