# ===== Spring: IoC 컨테이너 =====
- topic: Spring
  q: "PaymentService가 생성자 안에서 new KakaoPayGateway()로 구현체를 직접 만들 때 생기는 문제로 글에서 설명한 것은?"
  choices:
    - "객체가 너무 많이 만들어져 메모리가 부족해진다"
    - "구체 클래스를 직접 알고 있어서 결제 수단을 바꾸려면 서비스 코드를 고쳐야 한다(OCP 위반)"
    - "생성자에서는 new를 쓸 수 없어 컴파일 에러가 난다"
    - "스프링이 이 객체를 Bean으로 등록하지 못한다"
  answer: 1
  explain: "서비스가 구체 클래스에 결합되어 구현체를 바꿀 때마다 서비스 코드를 열어야 하므로 확장에는 열려 있고 변경에는 닫혀 있어야 한다는 OCP에 어긋난다. 나머지 보기는 글의 설명이 아니다."
  post: "spring-ioc-container"

- topic: Spring
  q: "@Configuration 클래스에서 @Bean 메서드 kakaoPayGateway()를 만들었을 때, 별도 지정이 없으면 이 Bean의 이름은?"
  code: |
    @Bean
    public KakaoPayGateway kakaoPayGateway() {
        return new KakaoPayGateway();
    }
  choices:
    - "KakaoPayGateway"
    - "bean"
    - "kakaoPayGateway"
    - "gateway"
  answer: 2
  explain: "@Bean의 이름은 기본적으로 메서드명이다. 이름을 바꾸려면 @Bean(\"single\")처럼 직접 지정한다."
  post: "spring-ioc-container"

- topic: Spring
  q: "제어의 역전(IoC)에서 역전되는 제어권은 무엇인가?"
  choices:
    - "객체를 만들고 연결하는 제어권이 개발자 코드에서 스프링 컨테이너로 넘어간다"
    - "메서드를 호출하는 순서가 컴파일러에 의해 뒤집힌다"
    - "인터페이스와 구현체의 상속 방향이 반대가 된다"
    - "데이터베이스 접근 권한이 서비스에서 컨트롤러로 넘어간다"
  answer: 0
  explain: "글에서는 객체를 만들고 연결하는 일을 개발자가 아니라 IoC 컨테이너가 맡는 것을 IoC라고 설명한다."
  post: "spring-ioc-container"

- topic: Spring
  q: "@Scope를 따로 지정하지 않은 Bean에 대해 getBean()을 두 번 호출하면 어떻게 되는가?"
  choices:
    - "매번 새 인스턴스가 만들어진다"
    - "두 번째 호출은 예외가 발생한다"
    - "요청마다 스레드별로 다른 인스턴스가 만들어진다"
    - "항상 같은 인스턴스가 반환된다"
  answer: 3
  explain: "Bean의 기본 스코프는 singleton이므로 컨테이너에 하나만 만들어 계속 같은 인스턴스를 돌려준다. 요청마다 새 인스턴스를 만드는 것은 prototype이다."
  post: "spring-ioc-container"

- topic: Spring
  q: "singleton Bean(service 클래스)의 필드에 요청별 상태(orderId 등)를 저장하면 위험한 이유는?"
  choices:
    - "필드에는 String 타입을 쓸 수 없기 때문이다"
    - "Bean이 하나뿐이라 모든 요청이 그 필드를 공유해서 값이 서로 덮어써질 수 있기 때문이다"
    - "필드가 있으면 컨테이너가 Bean 등록을 거부하기 때문이다"
    - "private 필드는 getter로 읽을 수 없기 때문이다"
  answer: 1
  explain: "singleton은 인스턴스 하나를 모든 요청이 쓰므로 한 요청이 저장한 값을 다른 요청이 덮어쓸 수 있다. 데이터는 요청마다 DTO에 담는 것이 글의 결론이다."
  post: "spring-ioc-container"

- topic: Spring
  q: "다음 코드를 실행했을 때 두 번째 출력(single2)은? (PaymentService는 processPay()에서 this.orderId에 값을 저장하고, getOrderId()는 그 값을 반환한다. \"single\"은 singleton Bean이다.)"
  code: |
    PaymentService single = context.getBean("single", PaymentService.class);
    single.processPay("order-001", 3);
    System.out.println("single 의 주문 ID = " + single.getOrderId());

    PaymentService single2 = context.getBean("single", PaymentService.class);
    System.out.println("single2 의 주문 ID = " + single2.getOrderId());
  choices:
    - "single2 의 주문 ID = null"
    - "single2 의 주문 ID = order-002"
    - "single2 의 주문 ID = order-001"
    - "NullPointerException이 발생한다"
  answer: 2
  explain: "두 변수는 같은 singleton 인스턴스를 가리키므로 single2에서 processPay()를 호출하지 않아도 order-001이 그대로 나온다."
  post: "spring-ioc-container"

- topic: Spring
  q: "글의 실습 코드에서 prototype을 확인하려던 부분이 사실은 singleton을 확인하고 있었던 이유는?"
  code: |
    PaymentService proto = context.getBean("single", PaymentService.class);
    PaymentService proto2 = context.getBean("single", PaymentService.class);
  choices:
    - "변수 이름이 proto이지만 꺼내는 Bean 이름이 \"single\"이라서 같은 singleton 인스턴스를 받기 때문이다"
    - "prototype Bean은 getBean()으로 꺼낼 수 없기 때문이다"
    - "@Scope(\"prototype\")이 메서드가 아닌 클래스에 붙어 있었기 때문이다"
    - "ApplicationContext가 prototype을 지원하지 않기 때문이다"
  answer: 0
  explain: "prototype 차이를 보려면 getBean(\"proto\", ...)로 꺼내야 한다. 변수 이름만 proto일 뿐 Bean 이름은 \"single\"이어서 같은 인스턴스가 나온다."
  post: "spring-ioc-container"

- topic: Spring
  q: "AppConfig에서 결제 수단을 네이버페이에서 카카오페이로 바꾸려면 글의 예제에서 어디를 고치면 되는가?"
  code: |
    @Bean
    public PaymentService paymentService() {
        return new PaymentService(naverPayGateway());
    }
  choices:
    - "PaymentService 클래스의 필드 타입과 생성자를 모두 바꾼다"
    - "PaymentInterface의 메서드 시그니처를 바꾼다"
    - "Application의 getBean() 호출 줄을 바꾼다"
    - "paymentService() 안의 naverPayGateway()를 kakaoPayGateway()로 한 번 바꾼다"
  answer: 3
  explain: "서비스는 인터페이스만 알기 때문에 교체 지점이 설정 클래스(AppConfig) 한 곳으로 줄어든다."
  post: "spring-ioc-container"

- topic: Spring
  q: "@Scope(\"prototype\")이 붙은 Bean에 대해 getBean()을 두 번 호출하면 서로 다른 인스턴스가 반환된다."
  choices:
    - "O"
    - "X"
  answer: 0
  explain: "prototype은 요청할 때마다 새 인스턴스를 반환하는 스코프다."
  post: "spring-ioc-container"

# ===== Spring: DI 주입 방식 =====
- topic: Spring
  q: "@Autowired로 의존성을 주입받으려면 주입 대상 클래스는 먼저 어떤 상태여야 하는가?"
  choices:
    - "반드시 인터페이스여야 한다"
    - "static 클래스여야 한다"
    - "컨테이너에 Bean으로 등록되어 있어야 한다"
    - "final 클래스여야 한다"
  answer: 2
  explain: "@Autowired는 컨테이너 안에 있는 Bean을 찾아서 넣어 주므로, 넣을 대상이 @Component 계열이나 @Bean으로 먼저 등록되어 있어야 한다."
  post: "spring-di-injection-types"

- topic: Spring
  q: "필드 주입(@Autowired를 필드에 붙이는 방식)의 단점으로 글에서 지적한 것은?"
  choices:
    - "final을 쓸 수 없고, 메서드 안에서 의존성을 직접 대입해도 컴파일 에러가 나지 않는다"
    - "컨테이너가 주입을 전혀 하지 못한다"
    - "객체가 생성되는 시점에 항상 예외가 발생한다"
    - "private 필드에는 사용할 수 없다"
  answer: 0
  explain: "필드는 선언 시점에 초기화되지 않으므로 final을 쓸 수 없고, 그래서 컨테이너가 넣어 준 의존성을 코드가 조용히 덮어써도 컴파일러가 막지 못한다. 예제에서도 private 필드에 @Autowired를 붙였다."
  post: "spring-di-injection-types"

- topic: Spring
  q: "세터 주입의 장점으로 글에서 정리한 것은?"
  choices:
    - "필드를 final로 선언할 수 있다"
    - "코드가 가장 짧다"
    - "의존성이 빠지면 객체 생성이 실패해서 누락을 막아 준다"
    - "선택적 의존관계를 가질 수 있다"
  answer: 3
  explain: "세터 주입은 의존성이 없어도 객체가 만들어질 수 있어 선택적 의존관계에 어울린다. final을 못 쓰는 것은 단점이고, 가장 짧은 것은 필드 주입, 누락 방지는 생성자 주입의 특징이다."
  post: "spring-di-injection-types"

- topic: Spring
  q: "세터 주입에서 setPaymentInterface()가 호출되지 않은 채 processPay()를 호출하면 어떻게 될 수 있는가?"
  choices:
    - "컨테이너가 자동으로 기본 구현체를 만들어 넣는다"
    - "필드가 null인 상태라 NullPointerException이 날 수 있다"
    - "컴파일 단계에서 에러가 난다"
    - "processPay()가 아무 일도 하지 않고 true를 반환한다"
  answer: 1
  explain: "세터가 호출되지 않으면 필드가 null로 남고, 그 상태로 메서드를 호출하면 NullPointerException이 날 수 있다."
  post: "spring-di-injection-types"

- topic: Spring
  q: "다음 두 서비스에서 processPay() 안에 아래 대입문을 추가했을 때의 결과로 옳은 것은?"
  code: |
    // A: 필드 주입
    @Autowired
    private PaymentInterface paymentInterface;

    // B: 생성자 주입
    private final PaymentInterface paymentInterface;

    // 추가한 대입문
    paymentInterface = new NaverPayGateway();
  choices:
    - "A, B 모두 컴파일 에러가 난다"
    - "A, B 모두 컴파일 에러가 나지 않는다"
    - "A는 컴파일 에러가 나고 B는 나지 않는다"
    - "A는 컴파일 에러가 나지 않고 B는 final이라 컴파일 에러가 난다"
  answer: 3
  explain: "필드 주입은 final을 쓸 수 없어 대입해도 에러가 없고, 생성자 주입의 final 필드는 생성자 밖에서 대입하면 컴파일 에러가 난다. 이것이 불변성 보장이다."
  post: "spring-di-injection-types"

- topic: Spring
  q: "생성자가 하나뿐인 클래스에서는 생성자의 @Autowired를 생략해도 주입된다."
  choices:
    - "O"
    - "X"
  answer: 0
  explain: "글에서 생성자가 하나뿐이면 @Autowired를 생략해도 주입된다고 설명한다."
  post: "spring-di-injection-types"

- topic: Spring
  q: "@Component를 붙인 NaverPayGateway 클래스가 Bean으로 등록될 때, 이름을 따로 지정하지 않으면 이름은?"
  choices:
    - "NaverPayGateway"
    - "naver"
    - "gateway"
    - "naverPayGateway"
  answer: 3
  explain: "@Component의 기본 Bean 이름은 클래스명의 앞글자를 소문자로 바꾼 값이다."
  post: "spring-di-injection-types"

- topic: Spring
  q: "@ComponentScan의 excludeFilters로 스캔 대상에서 제외할 수 있는 기준으로 글에서 든 것은?"
  choices:
    - "파일 크기, 수정 날짜, 작성자"
    - "클래스명, 어노테이션, 정규표현식 중 하나"
    - "메서드 개수, 필드 개수"
    - "Gradle 모듈 이름"
  answer: 1
  explain: "excludeFilters로 클래스명, 어노테이션, 정규표현식 중 하나를 골라 스캔에서 뺄 수 있다."
  post: "spring-di-injection-types"

- topic: Spring
  q: "필드 주입에서는 @Autowired가 붙은 필드를 final로 선언할 수 있다."
  choices:
    - "O"
    - "X"
  answer: 1
  explain: "필드가 선언 시점에 초기화되지 않으므로 컴파일러가 final을 허용하지 않는다. final을 쓸 수 있는 것은 생성자 주입이다."
  post: "spring-di-injection-types"

# ===== Spring: AOP 실습 =====
- topic: Spring
  q: "AppConfig에서 @EnableAspectJAutoProxy를 지우면 어떻게 되는가?"
  choices:
    - "Aspect가 두 번 실행된다"
    - "컨테이너 시작 시 예외가 발생한다"
    - "Aspect 클래스가 있어도 프록시가 만들어지지 않아 로그가 하나도 찍히지 않는다"
