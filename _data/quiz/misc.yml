  answer: 0
  explain: "인터페이스가 없으므로 Spring은 MemberService를 상속한 CGLIB 클래스를 만들어 그 객체를 Bean으로 돌려준다. 글에서는 사장님(진짜 객체) 대신 비서(프록시)를 받은 셈이라고 비유한다."
  post: "spring-aop-practice"

- topic: Spring
  q: "@Around 어드바이스에서 joinPoint.proceed()를 호출하지 않으면 어떻게 되는가?"
  choices:
