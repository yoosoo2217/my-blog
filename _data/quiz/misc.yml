    - "@Before 어드바이스만 건너뛴다"
    - "원래 메서드가 두 번 실행된다"
    - "진짜 메서드(타깃)가 아예 실행되지 않는다"
  answer: 3
  explain: "proceed()가 타깃 메서드를 실제로 호출하는 지점이므로, 부르지 않으면 진짜 메서드는 실행되지 않는다."
