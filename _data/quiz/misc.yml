- topic: Spring
  q: "정상 종료되는 메서드(회원 가입)에 LoggingAspect(@Before/@AfterReturning/@After)와 PerformanceAspect(@Around, @Order(1))가 적용되었을 때 출력 순서는?"
  choices:
    - "Around 성능 측정 → Before → 본문 → AfterReturning → After"
    - "Before → After → AfterReturning → 본문 → Around"
    - "Before → 본문 → AfterReturning → After → Around 성능 측정"
    - "본문 → Before → AfterReturning → Around → After"
  answer: 2
  explain: "글의 실행 결과는 Before, 메서드 본문, AfterReturning, After, 마지막에 Around의 성능 측정 로그 순서다. Around는 finally에서 출력하고 가장 바깥 겹이라 가장 늦게 빠져나온다."
  post: "spring-aop-practice"

- topic: Spring
  q: "대상 메서드에서 예외가 발생했을 때의 Advice 동작으로 글의 실행 결과와 맞는 것은?"
  choices:
    - "AfterReturning은 호출되지 않고 AfterThrowing이 실행되며, After도 실행된다"
    - "AfterReturning과 AfterThrowing이 모두 실행된다"
    - "AfterThrowing만 실행되고 After는 실행되지 않는다"
    - "어떤 Advice도 실행되지 않는다"
  answer: 0
  explain: "@AfterReturning은 정상 종료에만, @AfterThrowing은 예외에만 실행되고, @After는 finally처럼 예외가 나도 실행된다."
  post: "spring-aop-practice"

- topic: Spring
  q: "PerformanceAspect에 @Order(1)을 붙이고 LoggingAspect에는 붙이지 않았을 때 알맞은 설명은?"
  choices:
    - "LoggingAspect가 바깥 겹이라 성능 측정 시간에는 로깅 시간이 빠진다"
